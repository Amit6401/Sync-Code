# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
# Render Blueprint — deploys the API/WebSocket server.
# Client is deployed separately on Vercel (see README).
#
# To use: push this repo, then in Render: New > Blueprint > select this repo.
# Render will prompt for the `sync: false` secrets (MONGO_URI, CLIENT_URL).
services:
  - type: web
    name: collab-code-editor-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: JWT_SECRET
        generateValue: true
      - key: MONGO_URI
        sync: false
      - key: CLIENT_URL
        sync: false

  # Optional: host the client on Render instead of Vercel.
  # Set Vercel aside and uncomment this block, then set VITE_API_URL / VITE_WS_URL.
  # - type: web
  #   name: collab-code-editor-web
